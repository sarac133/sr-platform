/* Allow style="a:b;c:d" strings in htm templates (React wants objects). */
(function () {
  function toObj(s) {
    if (typeof s !== 'string') return s;
    var o = {}; s.split(';').forEach(function (d) {
      var i = d.indexOf(':'); if (i < 0) return;
      var k = d.slice(0, i).trim(), v = d.slice(i + 1).trim(); if (!k) return;
      var cc = k.indexOf('--') === 0 ? k : k.replace(/-([a-z])/g, function (_, c) { return c.toUpperCase(); });
      o[cc] = v;
    });
    return o;
  }
  var orig = React.createElement;
  React.createElement = function (type, props) {
    if (props && typeof props.style === 'string') { props = Object.assign({}, props, { style: toObj(props.style) }); }
    return orig.apply(this, [type, props].concat([].slice.call(arguments, 2)));
  };
  window.SR = { html: htm.bind(React.createElement) };
})();
